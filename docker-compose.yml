# Infra for local development: Postgres, Redis (AOF-persisted) and Elasticsearch.
# The API/worker and the frontend run on the host with `npm run dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reachinbox
    ports: ["${POSTGRES_PORT:-55432}:5432"]  # uncommon host port so it never clashes with another Postgres (override with POSTGRES_PORT)
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # appendonly + everysec fsync: delayed BullMQ jobs survive a Redis restart (≤1s of writes at risk)
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports: ["${REDIS_PORT:-56379}:6379"]  # uncommon host port so it never clashes with another Redis (e.g. one inside WSL)
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      retries: 20

volumes:
  pgdata:
  redisdata:
  esdata:
