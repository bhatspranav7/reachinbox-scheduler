# Infra (always): Postgres, Redis (AOF-persisted) and Elasticsearch.
#   docker compose up -d                      -> infra only; run backend/frontend with `npm run dev`
#   docker compose --profile app up --build   -> the whole app in containers (API, worker, frontend)
#   ... --scale worker=3                      -> several workers; limits stay exact (Redis-backed)

x-backend-env: &backend-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/reachinbox
  REDIS_URL: redis://redis:6379
  ELASTICSEARCH_URL: http://elasticsearch:9200

x-backend-deps: &backend-deps
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  elasticsearch: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reachinbox
    ports: ["${POSTGRES_PORT:-55432}:5432"]  # uncommon host port so it never clashes with another Postgres (override with POSTGRES_PORT)
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # appendonly + everysec fsync: delayed BullMQ jobs survive a Redis restart (≤1s of writes at risk)
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports: ["${REDIS_PORT:-56379}:6379"]  # uncommon host port so it never clashes with another Redis (e.g. one inside WSL)
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      retries: 20

  # ---------------- app (profile "app") ----------------
  backend:
    profiles: ["app"]
    build: ./backend
    env_file: ./backend/.env          # Google / Slack / limits; infra URLs are overridden below
    environment:
      <<: *backend-env
      RUN_WORKER: "false"             # the API only; sending happens in the worker service
    ports: ["4000:4000"]
    depends_on: *backend-deps
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null || exit 1"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build: ./backend
    command: ["node", "dist/worker.js"]
    env_file: ./backend/.env
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }   # backend runs the DB migrations first
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000   # what the *browser* calls
    env_file: ./frontend/.env.local   # NEXTAUTH_SECRET, Google client id/secret
    environment:
      API_URL: http://backend:4000    # what the Next.js *server* calls (container network)
      NEXTAUTH_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  esdata:
